<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- App identity -->
    <title>DP Work App</title>
    <meta name="description" content="Bengaluru Satsang Local DP APP — SUK-wise DP Activity &amp; Member Tracker" />
    <meta name="application-name" content="DP Work" />

    <!-- Open Graph — controls WhatsApp / social link previews -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://dpworkbengaluru.vercel.app/" />
    <meta property="og:title"       content="DP Work App" />
    <meta property="og:description" content="Bengaluru Satsang Local DP APP — SUK-wise DP Activity &amp; Member Tracker" />
    <meta property="og:image"       content="https://dpworkbengaluru.vercel.app/icons/icon-512.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme colour (Android status bar + browser tab) -->
    <meta name="theme-color" content="#0284c7" />

    <!-- iOS "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DP Work" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Register service worker for offline/PWA support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
