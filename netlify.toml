# Netlify configuration for DP Work App

[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

# --- API: map /api/* -> Netlify Functions ---

[[redirects]]
  from   = "/api/auth"
  to     = "/.netlify/functions/auth"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/members"
  to     = "/.netlify/functions/members"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/visits"
  to     = "/.netlify/functions/visits"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/payments"
  to     = "/.netlify/functions/payments"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/drives"
  to     = "/.netlify/functions/drives"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/workers"
  to     = "/.netlify/functions/workers"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/migrate"
  to     = "/.netlify/functions/migrate"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/users"
  to     = "/.netlify/functions/users"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/audit"
  to     = "/.netlify/functions/audit"
  status = 200
  force  = true

# --- SPA fallback — must come LAST ---
# Without this, refreshing any page other than "/" gives a 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# --- Security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache static assets (Vite hashes filenames, safe to cache forever)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker — never cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
